<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <link rel="icon" href="./src/assets/minesweeper-icon.png">
  <link rel="stylesheet" href="./src/app.css">
  
  <title>Minesweeper</title>
</head>
<body>
  <main class="main-wrapper">
  <!-- Main Container -->
  <div class="main-container 
              back-c-gray
              border-base border-c-1
              padding-base
              pos-rel
              d-flex flex-d-column gap-p5"
  >

    <!-- Header Container -->
    <div class="header
                back-c-gray font-orbitron
                border-base border-c-2
                d-grid"
    >

      <!-- Header > Count Bombs -->
      <span class="count-bombs
                   border-base border-c-1
                   d-flex al-i-center jc-space_between js-start"
      >
        <span id="number-count-bombs">00</span>
        <img src="./src/assets/bomb.png" alt="bomb">
      </span>
      <!-- Header > Smile Button -->
      <span id="smile" 
            class="border-base border-c-1
                   d-flex al-i-center js-center"
      >
        <img id="smile-face" src="./src/assets/smile-face3.png" alt="smile">
      </span>
      <!-- Header > Timer -->
      <span class="timer
                   border-base border-c-1
                   d-flex al-i-center jc-space_between js-end"
      >
        <span id="number-timer">00:00</span>
        <img src="./src/assets/timer.png" alt="timer">
      </span>

    </div>

    <!-- Game Body Container -->
    <div class="game-body
                back-c-gray font-orbitron font-s-1p2
                border-base border-c-2 padding-base
                d-grid ji-center al-i-start jc-space_between gap-p5"
    >

      <!-- Config Container -->
      <div class="config
                  border-base border-c-2 padding-base
                  d-flex flex-d-column gap-1 js-start"
      >

        <!-- Config > Settings Container -->
        <div id="settings-button" 
             class="settings
                    border-w-p3 border-s-sol border-c-1 padding-p1
                    d-flex al-s-start"
        >
          <img src="./src/assets/settings.png" alt="settings">
        </div>
        <!-- Config > Rows and Columns -->
        <div class="row-col-container 
                    d-flex flex-d-row jc-space_between gap-p5"
        >

          <!-- Rows -->
          <div class="input-field 
                      d-flex flex-d-column"
          >
            <label for="row">Rows</label>
            <input id="row"
                   name="rows" 
                   type="number" 
                   value="7"
            >
          </div>
          <!-- Columns -->
          <div class="input-field 
                      d-flex flex-d-column"
          >
            <label for="column">Columns</label>
            <input id="column"
                   name="columns" 
                   type="number" 
                   value="7"
            >
          </div>

        </div>
        <!-- Config > Bomb Ratio -->
        <div class="bomb-ratio-container 
                    d-flex flex-d-row jc-space_between al-i-center gap-p5"
        >
          <div class="input-field
                      d-flex flex-d-row al-i-center gap-p5"
          >
            <input id="bomb-ratio-number" 
                  name="bomb-ratio-number" 
                  type="number" min="1" max="50" step="1" value="10"
            >
            <span>%</span>
          </div>
          <div class="slider-field
                    d-flex flex-d-column"
          >
            <label for="bomb-ratio-slider">Bomb Ratio</label>
            <input id="bomb-ratio-slider" 
                  name="bomb-ratio-slider" 
                  type="range" min="1" max="50" step="1" value="10"
            >
          </div>
        </div>
        <!-- Config > Square Width Container -->
        <div class="square-width-container
                    d-flex flex-d-column gap-1"
        >
          <div class="d-flex flex-d-row jc-space_between al-i-center gap-p5"
          >
            
            <div class="input-field
                        d-flex flex-d-row al-i-center gap-p5"
            >
              <input id="square-width-number"
                     name="square-width-number" 
                     type="number" min="15" max="45" step="1" value="20"
              >
              <span>px</span>
            </div>
            <div class="slider-field
                        d-flex flex-d-column"
            >
              <label for="square-width-slider">Square Width</label>
              <input id="square-width-slider" 
                     name="square-width-slider" 
                     type="range" min="15" max="45" step="1" value="20">
            </div>

          </div>
          <!-- HIDDEN CONTENT: Square Width Container > Preview-Box -->
          <div class="preview-wrapper hidden
                      d-grid"
          >
            
            <div class="size-preview-box 
                        d-flex flex-d-row jc-space_around al-i-center gap-1"
            >
  
              <div>
                <span>Size :</span>
              </div>
              <div id="preview-box" 
                  class="d-flex jc-center al-i-center 
                          height-6 width-6 border-w-p1 border-s-dash border-c-gray"
              >
                <div class="preview-square square hidden"></div>
              </div>

            </div>

          </div>
        </div>

      </div>
      <!-- Game Body > Grid Container -->
      <!-- ... -->

    </div>
    
  </div>
  
  </main>
  <!-- HIDDEN CONTENT:  Game Over Modal -->
  <div class="game-over-modal hidden
              back-c-gray
              padding-1p5 border-base border-c-1
              d-flex flex-d-column al-i-center jc-space_evenly
              pos-abs"
  >

    <div class="game-over-modal-x-mark">
      <img id="game-over-modal-x-mark" src="./src/assets/x-mark2.png" alt="x-mark">
    </div>
    <div class="game-over-modal-text
                font-orbitron
                d-flex flex-d-column al-i-center jc-center t-al-center gap-p5">
      <h1 id="game-over-modal-text">${texto}</h1>
      <p>Would you like to try again?</p>
    </div>
    <button id="game-over-modal-restart-button"
            class="font-orbitron back-c-gray
                   border-base border-c-1"
    >
      Start Game
    </button>

  </div>
  <script type="module" src="./src/app.ts"></script>
</body>
</html>
