<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <link rel="icon" href="./assets/minesweeper-icon.png">
  <link rel="stylesheet" href="./src/app.css">
  
  <title>Minesweeper</title>
</head>
<body>
  <div class="main-container">

    <div class="header
                back-c-gray
                border-base border-c-2 font-orbitron
                d-grid"
    >

      <span class="count-bombs
                   border-base border-c-1
                   d-flex al-i-center js-start"
      >
        <span id="number-count-bombs">00</span>
        <img src="./assets/bomb.png" alt="bomb">
      </span>

      <span id="smile" 
            class="border-base border-c-1
                   d-flex al-i-center js-center"
      >
        <img src="./assets/smile-face.png" alt="smile">
      </span>

      <span class="timer
                   border-base border-c-1
                   d-flex al-i-center js-end"
      >
        <span id="number-timer">00:00</span>
        <img src="./assets/timer.png" alt="timer">
      </span>

    </div>
    
    <div class="game-body
                back-c-gray
                padding-base
                d-flex jc-center al-i-center">

      <!-- <div class="config">
        <input id="n-row" type="number" value="16">
        <input id="n-column" type="number" value="16">
      </div> -->

      <!-- *div* Grid Container */div* -->

    </div>

  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
